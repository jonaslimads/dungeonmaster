global
    log stdout format raw local0
    maxconn 256

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http_in
    bind *:80
    redirect scheme https code 301

frontend https_in
    bind *:443 ssl crt /etc/haproxy/ssl/combined.pem no-sslv3
    http-request set-header X-Forwarded-Proto https

    acl is_api path_beg /api

    use_backend voice if is_api
    default_backend web

backend web
    server web1 web:3000

backend voice
    server voice1 voice:8000
